name: api

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/api/**"
      - "features/quiz/**"
      - "internal/tooling/**"
      - ".github/workflows/api.yml"
      - ".github/actions/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @platform/api lint
      - run: pnpm --filter @platform/api test
